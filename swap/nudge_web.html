<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dock Controller</title>
<style>
:root{--bg:#111418;--panel:#1b2027;--line:#2c333d;--fg:#e8ecf1;--dim:#8a95a3;--acc:#e8a33d;--go:#3fae6a;--stop:#d9473f;--blue:#4a8fe0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,Segoe UI,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:14px;padding:14px;height:100vh}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
.cam{background:#000;border-radius:10px;overflow:hidden;position:relative;min-height:240px}
.cam img{width:100%;height:100%;object-fit:contain;display:block}
.cam .tag{position:absolute;left:10px;top:10px;background:#000a;padding:3px 8px;border-radius:6px;font-size:13px}
.side{display:flex;flex-direction:column;gap:12px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.status{font:600 15px ui-monospace,Consolas,monospace}
.msg{margin-top:6px;color:var(--acc);min-height:1.3em}
.busy{color:var(--blue)}
.frozen{background:#4a1c1a;border-color:var(--stop)}
button{background:#262d36;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 8px;font:600 14px system-ui;cursor:pointer;user-select:none}
button:hover{border-color:var(--acc)}button:active{background:#323b47}
button.sel{border-color:var(--acc);color:var(--acc)}
.big{font-size:17px;padding:14px}
.go{background:#1f3a2a;border-color:var(--go)}.stopb{background:var(--stop);border-color:var(--stop);font-size:20px;width:100%;padding:16px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
small{color:var(--dim)}kbd{background:#0006;border-radius:4px;padding:0 4px;font-size:11px;color:var(--dim)}
.loads span{display:inline-block;margin-right:10px}
.hot{color:var(--stop)}
input{background:#0d1014;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font:14px system-ui;width:100%}
</style></head><body>
<div class="wrap">
  <div class="cam"><img id="cam" alt="dock cam"><div class="tag" id="camtag">dock cam</div></div>
  <div class="side">
    <button class="stopb" onclick="c('stop')">STOP <kbd>Space</kbd></button>
    <div class="card" id="stcard">
      <div class="status" id="st">connecting…</div>
      <div class="loads status" id="ld"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="card">
      <h2>1 · I line it up</h2>
      <div class="row3"><button class="big go" onclick="c('autopick')">AUTO PICK</button><button class="big" onclick="c('lineup')">LINE UP only</button><button class="big" onclick="c('resume')">Resume</button></div>
      <small>AUTO PICK = your 17:55 lock: line up (z 100) → pre-twist → push to the stop → twist till it catches → ease out → lift 20. Stops on any snag; adjust and use the step-3 buttons.</small>
      <div class="row3" style="margin-top:8px">
        <button class="big" onclick="c('overdock')" title="up first, then over: never in from the front">OVER DOCK</button>
        <button onclick="c('tool_on')">Tool is ON</button><button onclick="c('tool_off')">Tool is OFF</button>
      </div>
      <small id="toolst"></small>
      <div class="steps" style="grid-template-columns:auto repeat(3,1fr);margin-top:8px;align-items:center">
        <small>This try is:</small>
        <button data-i="practice" onclick="it('practice')">practice</button><button data-i="pick" onclick="it('pick')">pick</button><button data-i="drop" onclick="it('drop')">drop</button>
      </div>
    </div>
    <div class="card">
      <h2>2 · You adjust</h2>
      <div class="steps" style="margin-bottom:8px">
        <button data-s="1" onclick="st('1')">0.5 mm</button><button data-s="2" onclick="st('2')">1 mm</button>
        <button data-s="3" onclick="st('3')">2 mm</button><button data-s="4" onclick="st('4')">5 mm</button>
        <button onclick="c('soft')" id="soft">pan soft</button>
      </div>
      <div class="pad">
        <button onclick="c('up')">▲ Up <kbd>R</kbd></button><button onclick="c('in')">↑ In <kbd>W</kbd></button><button onclick="c('tipup')">Tip up <kbd>T</kbd></button>
        <button onclick="c('left')">← Left <kbd>A</kbd></button><button onclick="c('out')">↓ Out <kbd>S</kbd></button><button onclick="c('right')">Right → <kbd>D</kbd></button>
        <button onclick="c('down')">▼ Down <kbd>F</kbd></button><button onclick="c('rollm')">⟲ Twist <kbd>Q</kbd></button><button onclick="c('rollp')">Twist ⟳ <kbd>E</kbd></button>
      </div>
      <div style="margin-top:8px"><button onclick="c('tipdown')" style="width:100%">Tip down <kbd>G</kbd></button></div>
    </div>
    <div class="card">
      <h2>3 · Last steps</h2>
      <div class="row3">
        <button class="big go" onclick="c('push')">PUSH IN <kbd>I</kbd></button>
        <button class="big go" onclick="c('lock')">LOCK <kbd>L</kbd></button>
        <button class="big" onclick="c('lift')">LIFT 20 <kbd>Y</kbd></button>
      </div>
      <div class="row3" style="margin-top:8px">
        <button onclick="c('relax')">Relax twist <kbd>Z</kbd></button>
        <button onclick="c('unlock')">Unlock <kbd>U</kbd></button>
        <button onclick="c('save_lineup')" title="the tool is right here: next LINE UP comes back here (minus 10 mm)">Save tool spot</button>
      </div>
    </div>
    <div class="card">
      <h2>Mark</h2>
      <div class="row3" style="margin-bottom:8px">
        <button onclick="mk('wiggle')">wiggle ✓</button><button onclick="mk('miss')">miss</button><button onclick="mk('snag')">snag</button>
      </div>
      <input id="note" placeholder="note + Enter" onkeydown="if(event.key==='Enter'){mk(this.value);this.value=''}">
    </div>
  </div>
</div>
<script>
const c=(cmd,a='')=>fetch(`/cmd?c=${cmd}&a=${encodeURIComponent(a)}`);
const st=s=>{c('step',s);document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('sel',b.dataset.s===s))};
const mk=n=>{if(n)c('mark',n)};
const it=n=>c('intent',n);
st('2');
const K={w:'in',s:'out',a:'left',d:'right',r:'up',f:'down',t:'tipup',g:'tipdown',q:'rollm',e:'rollp',i:'push',l:'lock',y:'lift',z:'relax',u:'unlock'};
document.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT')return;
  if(ev.key===' '){ev.preventDefault();c('stop');return}
  if('1234'.includes(ev.key)){st(ev.key);return}
  const k=K[ev.key.toLowerCase()]; if(k){ev.preventDefault();c(k)}
});
async function poll(){
  try{
    const s=await (await fetch('/state')).json();
    document.getElementById('st').textContent=`x ${s.x}  y ${s.y}  z ${s.z}  tip ${s.az>=0?'+':''}${s.az}  roll ${s.roll}`;
    document.getElementById('ld').innerHTML=Object.entries(s.load).map(([k,v])=>`<span class="${Math.abs(v)>=50?'hot':''}">${k} ${v}%</span>`).join('')+`<span class="${s.temp>=50?'hot':''}">${s.temp} °C</span>`;
    const m=document.getElementById('msg');
    m.innerHTML=(s.frozen?`<b>FROZEN: ${s.why}</b> · `:'')+(s.busy?`<span class="busy">working: ${s.busy}…</span> `:'')+s.msg;
    document.getElementById('stcard').classList.toggle('frozen',s.frozen);
    document.getElementById('soft').classList.toggle('sel',s.soft);
    document.getElementById('toolst').textContent=s.tool_on?'Tool: ON the master (AUTO PICK locked out)':'Tool: off the master';
    document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('sel',b.dataset.i===s.intent));
    document.getElementById('camtag').textContent=s.take?`dock cam · REC ${s.take}`:'dock cam · not recording (last still)';
  }catch(e){document.getElementById('st').textContent='controller offline'}
  setTimeout(poll,300);
}
poll();
setInterval(()=>{document.getElementById('cam').src='/frame?'+Date.now()},500);
</script></body></html>
